name: Actualizar resultados
on:
  schedule:
    # cada hora de viernes a domingo y cada 2 horas los lunes (UTC)
    - cron: '15 * * * 5,6,0'
    - cron: '15 */2 * * 1'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: actualizar
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Leer ligas
        env: { CHROME_PATH: /usr/bin/google-chrome, TZ: America/Argentina/Buenos_Aires }
        run: node actualizar.mjs
      - name: Guardar si hubo cambios
        run: |
          git config user.name "real-resultados-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Resultados $(date -u +%F\ %H:%M)" && git push)
